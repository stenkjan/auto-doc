name: Hoam House 3D-Szene auf GitHub Pages

# Zweiter Ausspielweg für public/hoam-haus-3d-szene.html.
# Primär liefert Vercel die Datei bereits aus (Next.js serviert public/),
# erreichbar unter https://auto-doc-one.vercel.app/hoam-haus-3d-szene.html
# Dieser Workflow ist optional und nur nötig, wenn zusätzlich eine
# GitHub-Pages-Adresse gewünscht ist.
#
# EINMALIG NÖTIG: Settings -> Pages -> Build and deployment -> Source auf
# "GitHub Actions" stellen. Der Actions-Token darf eine Pages-Seite nicht
# selbst anlegen ("Resource not accessible by integration"), deshalb ist
# dieser eine Klick unvermeidbar. Danach läuft alles automatisch.
on:
  push:
    branches: [main]
    paths:
      - public/hoam-haus-3d-szene.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp public/hoam-haus-3d-szene.html _site/hoam-haus-3d-szene.html
          # Zugleich Startseite, damit der blanke Link am Handy reicht
          cp public/hoam-haus-3d-szene.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
