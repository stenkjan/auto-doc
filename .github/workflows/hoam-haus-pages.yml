name: Hoam House 3D-Szene auf GitHub Pages

# Veröffentlicht die eigenständige Datei hoam-haus-3d-szene.html als
# GitHub-Pages-Seite. Die Next.js-App dieses Repos läuft auf Vercel und
# bleibt davon unberührt.
on:
  push:
    branches: [main]
    paths:
      - hoam-haus-3d-szene.html
      - .github/workflows/hoam-haus-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp hoam-haus-3d-szene.html _site/hoam-haus-3d-szene.html
          # Zugleich Startseite, damit der blanke Link am Handy reicht
          cp hoam-haus-3d-szene.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
